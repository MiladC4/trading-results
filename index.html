<style>
* { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
body { margin: 0; padding: 16px; background: #0d1117; color: #e6edf3; font-size: 14px; }
h1 { font-size: 1.2rem; margin: 0 0 12px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
select, button { padding: 8px 12px; background: #161b22; border: 1px solid #30363d; color: #e6edf3; border-radius: 6px; font-size: 13px; }
button { background: #238636; border-color: #2ea043; cursor: pointer; }
button:hover { background: #2ea043; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid #21262d; }
th { background: #161b22; position: sticky; top: 0; }
tr:hover { background: #161b22; }
tr.selected { background: #1f3a2e; }
.positive { color: #3fb950; }
.negative { color: #f85149; }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 12px; }
.card { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 10px; text-align: center; }
.card .label { font-size: 11px; color: #8b949e; margin-bottom: 4px; }
.card .value { font-size: 1.1rem; font-weight: 600; }
.loading { text-align: center; padding: 40px; color: #8b949e; }
#chartContainer { height: 400px; margin-top: 16px; border-radius: 8px; overflow: hidden; }
</style>
</head>
<body>

function initDropdowns() {
  const s = document.getElementById('symbolFilter');
  SYMBOLS.forEach(sym => s.add(new Option(sym, sym)));
  const st = document.getElementById('strategyFilter');
  STRATEGIES.forEach(stg => st.add(new Option(stg, stg)));

  TIMEFRAMES.forEach(t => tf.add(new Option(t, t)));
}

function formatNum(n) {
  if (n === null || n === undefined) return '-';
  return Number(n).toLocaleString(undefined, {maximumFractionDigits: 2});
}

function renderTable(rows) {
  const container = document.getElementById('tableContainer');
  if (!rows.length) {
    container.innerHTML = '<div class="loading">داده‌ای یافت نشد</div>';
    return;
  }
  let html = '<table><thead><tr>';
  ['نماد', 'استراتژی', 'تایم‌فریم', 'معاملات', 'PnL%', 'Win Rate%', 'Max DD%', 'Sharpe'].forEach(h => html += '<th>' + h + '</th>');
  html += '</tr></thead><tbody>';
  rows.forEach(r => {
    const pnlCls = r.total_pnl >= 0 ? 'positive' : 'negative';
    const isSel = selectedRow && selectedRow.symbol === r.symbol && selectedRow.strategy === r.strategy && selectedRow.time_filter === r.time_filter ? ' selected' : '';
    html += '<tr onclick="loadChart(\'' + r.symbol + '\', \'' + r.time_filter + '\', this)" class="clickable' + isSel + '">';
    html += '<td>' + r.symbol + '</td>';
    html += '<td>' + r.strategy.toUpperCase() + '</td>';
    html += '<td>' + r.time_filter + '</td>';
    html += '<td>' + formatNum(r.trades) + '</td>';
    html += '<td class="' + pnlCls + '">' + formatNum(r.total_pnl) + '</td>';
    html += '<td>' + formatNum(r.win_rate) + '</td>';
    html += '<td class="negative">' + formatNum(r.max_dd) + '</td>';
    html += '<td>' + formatNum(r.sharpe) + '</td>';
    html += '</tr>';
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

function renderSummary(rows) {
  const totalCoins = new Set(rows.map(r => r.symbol)).size;
  const totalTrades = rows.reduce((s, r) => s + (r.trades || 0), 0);
  const avgWin = rows.length ? rows.reduce((s, r) => s + (r.win_rate || 0), 0) / rows.length : 0;
  const avgPnl = rows.length ? rows.reduce((s, r) => s + (r.total_pnl || 0), 0) / rows.length : 0;
  const best = rows.reduce((b, r) => (r.total_pnl || 0) > (b.total_pnl || 0) ? r : b, rows[0] || {});
  
  document.getElementById('summary').innerHTML = `
    <div class="card"><div class="label">کل نمادها</div><div class="value">${totalCoins}</div></div>
    <div class="card"><div class="label">کل معاملات</div><div class="value">${formatNum(totalTrades)}</div></div>
    <div class="card"><div class="label">میانگین Win Rate</div><div class="value">${avgWin.toFixed(1)}%</div></div>
    <div class="card"><div class="label">میانگین PnL</div><div class="value ${avgPnl >= 0 ? 'positive' : 'negative'}">${avgPnl.toFixed(2)}%</div></div>
    <div class="card"><div class="label">بهترین نماد</div><div class="value">${best.symbol || '-'} (${formatNum(best.total_pnl)}%)</div></div>
  `;
}

function applyFilters() {
  const sym = document.getElementById('symbolFilter').value;
  const stg = document.getElementById('strategyFilter').value;
  const tf = document.getElementById('timeframeFilter').value;
  let filtered = ALL_DATA;
  if (sym) filtered = filtered.filter(r => r.symbol === sym);
  if (stg) filtered = filtered.filter(r => r.strategy === stg);
  if (tf) filtered = filtered.filter(r => r.time_filter === tf);
  renderTable(filtered);
  renderSummary(filtered);
}

function resetFilters() {
  document.getElementById('symbolFilter').value = '';
  document.getElementById('strategyFilter').value = '';
  document.getElementById('timeframeFilter').value = '';
  renderTable(ALL_DATA);
  renderSummary(ALL_DATA);
}

  try {
    // Fetch candles from Supabase (symbol format is SYMBOL/USDT)
    const url = 'https://cjkxfclghjgmpzcxakpy.supabase.co/rest/v1/candles?symbol=eq.' + encodeURIComponent(symbol + '/USDT') + '&timeframe=eq.' + interval + '&order=timestamp.asc&limit=500';
    const response = await fetch(url, {headers: {'apikey': 'sb_publishable_l0iz-k9CIEYXpry0B_suhA_qj0VuWu_'}});
    const candles = await response.json();
    
    if (!candles.length) {
      container.innerHTML = '<div class="loading">داده کندل برای ' + symbol + ' ' + interval + ' یافت نشد</div>';
      return;
    }
    
    // Format for lightweight-charts
    const chartData = candles.map(c => ({
      time: Math.floor(c.timestamp / 1000),
      open: c.open,
      high: c.high,
      low: c.low,
      close: c.close
    }));
    
    // Create chart if not exists
    if (!chart) {
      chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: 400,
        layout: {background: {color: '#0d1117'}, textColor: '#e6edf3'},
        grid: {vertLines: {color: '#21262d'}, horzLines: {color: '#21262d'}},
        rightPriceScale: {borderColor: '#30363d'},
        timeScale: {borderColor: '#30363d', timeVisible: true, secondsVisible: false}
      });
      candleSeries = chart.addCandlestickSeries({
        upColor: '#3fb950', downColor: '#f85149',
        borderUpColor: '#3fb950', borderDownColor: '#f85149',
        wickUpColor: '#3fb950', wickDownColor: '#f85149'
      });
    }
    
    candleSeries.setData(chartData);
    chart.timeScale().fitContent();
    container.querySelector('.loading')?.remove();
    
  } catch (e) {
    container.innerHTML = '<div class="loading">خطا در بارگذاری نمودار: ' + e.message + '</div>';
  }
}

initDropdowns();
renderTable(ALL_DATA);
renderSummary(ALL_DATA);
console.log('Loaded', ALL_DATA.length, 'rows');
</script>
