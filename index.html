<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Trading Lab</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
* { box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; }
body { margin: 0; background: #0b0e11; color: #eaecef; font-size: 14px; }
.header { background: linear-gradient(135deg, #1e2329, #0b0e11); padding: 20px 16px; border-bottom: 1px solid #2b3139; }
.header h1 { margin: 0; font-size: 1.4rem; font-weight: 700; background: linear-gradient(90deg,#f0b90b,#fcd535); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header .sub { color: #848e9c; font-size: 0.8rem; margin-top: 4px; }
.container { padding: 16px; max-width: 1400px; margin: 0 auto; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
input, select, button { padding: 10px 16px; background: #1e2329; border: 1px solid #2b3139; color: #eaecef; border-radius: 8px; font-size: 13px; font-weight: 500; }
input { flex: 1; min-width: 150px; }
button { background: #f0b90b; border-color: #f0b90b; color: #0b0e11; cursor: pointer; font-weight: 600; }
button:hover { background: #fcd535; }
select:focus, input:focus { outline: none; border-color: #f0b90b; }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
.card { background: #1e2329; border: 1px solid #2b3139; border-radius: 10px; padding: 14px; text-align: center; }
.card .label { font-size: 11px; color: #848e9c; margin-bottom: 6px; }
.card .value { font-size: 1.3rem; font-weight: 700; }
.table-wrap { background: #1e2329; border-radius: 10px; overflow: auto; max-height: 500px; border: 1px solid #2b3139; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid #2b3139; white-space: nowrap; cursor: pointer; }
th { background: #161a1e; position: sticky; top: 0; color: #848e9c; font-weight: 600; font-size: 11px; user-select: none; }
th:hover { color: #f0b90b; }
tbody tr { cursor: pointer; transition: background 0.15s; }
tbody tr:hover { background: #2b3139; }
tbody tr.selected { background: #2b3139; box-shadow: inset 3px 0 0 #f0b90b; }
.positive { color: #0ecb81; font-weight: 600; }
.negative { color: #f6465d; font-weight: 600; }
.chart-section { margin-top: 20px; }
.chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.chart-title { font-size: 1rem; font-weight: 600; }
#chartContainer { height: 450px; background: #1e2329; border-radius: 10px; border: 1px solid #2b3139; overflow: hidden; position: relative; }
.loading { display: flex; align-items: center; justify-content: center; height: 100%; color: #848e9c; font-size: 0.9rem; }
.strat-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.strat-rf { background: #2b3139; color: #eaecef; }
.strat-zerolag { background: #1c2b3a; color: #4da8da; }
.strat-trend { background: #2b1c3a; color: #b07cff; }
.strat-div { background: #1c3a2b; color: #0ecb81; }
.strat-regime { background: #2b1c3a; color: #f7931a; }
.signals { margin-top: 20px; background: #1e2329; border-radius: 10px; border: 1px solid #2b3139; padding: 16px; }
.signals h2 { margin: 0 0 12px; font-size: 1rem; }
.sig-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2b3139; font-size: 12px; }
.sig-row:last-child { border-bottom: none; }
.sig-long { color: #0ecb81; }
.sig-short { color: #f6465d; }
.sig-status-open { color: #f0b90b; }
.sig-status-closed { color: #848e9c; }
@media (max-width: 600px) { .summary { grid-template-columns: repeat(2, 1fr); } th, td { padding: 8px; font-size: 11px; } }
</style>
</head>

<div class="header">
  <h1>🚀 Hermes Trading Lab</h1>
  <div class="sub">Backtest Results • 5m • TP 3% / SL 1.5% • Live Signals Every 5min</div>
</div>
<div class="container">
  <div class="summary" id="summary"></div>
  <div class="controls">
    <input id="searchBox" placeholder="جستجوی نماد..." oninput="applyFilters()">
    <select id="symbolFilter"><option value="">همه نمادها</option></select>
    <select id="strategyFilter"><option value="">همه استراتژی‌ها</option></select>
    <button onclick="applyFilters()">فیلتر</button>
    <button onclick="resetFilters()" style="background:#2b3139;border-color:#2b3139;color:#eaecef;">ریست</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th onclick="sortBy('symbol')">نماد ▲▼</th>
        <th onclick="sortBy('strategy')">استراتژی ▲▼</th>
        <th onclick="sortBy('trades')">معاملات ▲▼</th>
        <th onclick="sortBy('total_pnl')">PnL% ▲▼</th>
        <th onclick="sortBy('win_rate')">Win% ▲▼</th>
        <th onclick="sortBy('max_dd')">DD% ▲▼</th>
        <th onclick="sortBy('sharpe')">Sharpe ▲▼</th>
      </tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div class="chart-section">
    <div class="chart-header">
      <div class="chart-title" id="chartTitle">نمودار کندل ۵ دقیقه‌ای</div>
      <div style="color:#848e9c;font-size:12px;">روی هر ردیف کلیک کنید</div>
    </div>
    <div id="chartContainer"><div class="loading">یک ردیف از جدول را انتخاب کنید تا نمودار نمایش داده شود</div></div>
  </div>
  <div class="signals">
    <h2>📡 سیگنال‌های زنده</h2>
    <div id="signalsList"></div>
  </div>
</div>

async function fetchSignals() {

function initDropdowns() {
  const s = document.getElementById('symbolFilter');
  SYMBOLS.forEach(sym => s.add(new Option(sym, sym)));
  const st = document.getElementById('strategyFilter');
  STRATEGIES.forEach(stg => st.add(new Option(stg.toUpperCase(), stg)));
}

function fmt(n) { return n === null || n === undefined ? '-' : Number(n).toLocaleString(undefined, {maximumFractionDigits: 2}); }

function sortBy(col) {
  if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = -1; }
  ALL_DATA.sort((a,b) => { const x=a[col], y=b[col]; if (x<y) return -1*sortDir; if (x>y) return 1*sortDir; return 0; });
  renderTable(getFiltered());
}

function getFiltered() {
  const sym = document.getElementById('symbolFilter').value;
  const stg = document.getElementById('strategyFilter').value;
  const q = document.getElementById('searchBox').value.trim().toUpperCase();
  let f = ALL_DATA;
  if (sym) f = f.filter(r=>r.symbol===sym);
  if (stg) f = f.filter(r=>r.strategy===stg);
  if (q) f = f.filter(r=>r.symbol.includes(q));
  return f;
}

function renderTable(rows) {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  if (!rows.length) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#848e9c;padding:30px;">داده‌ای یافت نشد</td></tr>'; return; }
  rows.forEach(r => {
    const tr = document.createElement('tr');
    const pnlCls = r.total_pnl >= 0 ? 'positive' : 'negative';
    const isSel = selectedRow && selectedRow.symbol === r.symbol && selectedRow.strategy === r.strategy ? ' selected' : '';
    tr.className = isSel;
    tr.innerHTML = `<td>${r.symbol}</td>
      <td><span class="strat-badge ${STRAT_CLASS[r.strategy] || ''}">${r.strategy.toUpperCase()}</span></td>
      <td>${fmt(r.trades)}</td>
      <td class="${pnlCls}">${fmt(r.total_pnl)}</td>
      <td>${fmt(r.win_rate)}</td>
      <td class="negative">${fmt(r.max_dd)}</td>
      <td>${fmt(r.sharpe)}</td>`;
    tr.onclick = () => loadChart(r.symbol, r.strategy, tr);
    tbody.appendChild(tr);
  });
}

function renderSummary(rows, openCount) {
  const totalCoins = new Set(rows.map(r => r.symbol)).size;
  const totalTrades = rows.reduce((s,r) => s + (r.trades||0), 0);
  const avgWin = rows.length ? rows.reduce((s,r)=>s+(r.win_rate||0),0)/rows.length : 0;
  const avgPnl = rows.length ? rows.reduce((s,r)=>s+(r.total_pnl||0),0)/rows.length : 0;
  const best = rows.reduce((b,r)=>(r.total_pnl||0)>(b.total_pnl||0)?r:b, rows[0]||{});
  document.getElementById('summary').innerHTML = `
    <div class="card"><div class="label">نمادها</div><div class="value">${totalCoins}</div></div>
    <div class="card"><div class="label">معاملات</div><div class="value">${fmt(totalTrades)}</div></div>
    <div class="card"><div class="label">میانگین Win</div><div class="value">${avgWin.toFixed(1)}%</div></div>
    <div class="card"><div class="label">میانگین PnL</div><div class="value ${avgPnl>=0?'positive':'negative'}">${avgPnl.toFixed(1)}%</div></div>
    <div class="card"><div class="label">سیگنال‌های باز</div><div class="value ${openCount>0?'positive':'negative'}">${openCount}</div></div>
    <div class="card"><div class="label">بهترین</div><div class="value" style="font-size:0.9rem;">${best.symbol||'-'}<br><span class="positive">${fmt(best.total_pnl)}%</span></div></div>`;
}

async function renderSignals() {
  const signals = await fetchSignals();
  const el = document.getElementById('signalsList');
  if (!signals.length) { el.innerHTML = '<div style="color:#848e9c;padding:10px;">هنوز سیگنالی ثبت نشده</div>'; return; }
  const openCount = signals.filter(s => s.status === 'OPEN').length;
  el.innerHTML = signals.map(s => {
    const sideCls = s.side === 'LONG' ? 'sig-long' : 'sig-short';
    const statusCls = s.status === 'OPEN' ? 'sig-status-open' : 'sig-status-closed';
    const pnl = s.pnl_pct !== null ? (s.pnl_pct >= 0 ? '+' : '') + s.pnl_pct.toFixed(2) + '%' : '-';
    const pnlCls = s.pnl_pct > 0 ? 'positive' : (s.pnl_pct < 0 ? 'negative' : '');
    const stratCls = STRAT_CLASS[s.strategy] || '';
    return `<div class="sig-row">
      <span><span class="${sideCls}">${s.side}</span> ${s.symbol} <span class="strat-badge ${stratCls}">${(s.strategy||'').toUpperCase()}</span> • ${s.status}</span>
      <span class="${pnlCls}">${pnl}</span>
    </div>`;
  }).join('');
  return openCount;
}

function applyFilters() { const f = getFiltered(); renderTable(f); renderSummary(f, currentOpenCount); }
function resetFilters() {
  document.getElementById('symbolFilter').value='';
  document.getElementById('strategyFilter').value='';
  document.getElementById('searchBox').value='';
  renderTable(ALL_DATA); renderSummary(ALL_DATA, currentOpenCount);
}

let currentOpenCount = 0;
async function refreshAll() {
  currentOpenCount = await renderSignals();
  renderSummary(ALL_DATA, currentOpenCount);
}

async function loadChart(symbol, strategy, rowEl) {
  document.querySelectorAll('#tableBody tr').forEach(r=>r.classList.remove('selected'));
  if (rowEl) rowEl.classList.add('selected');
  selectedRow = ALL_DATA.find(r=>r.symbol===symbol && r.strategy===strategy);
  document.getElementById('chartTitle').textContent = `${symbol} • ${strategy.toUpperCase()} • 5m`;

  const container = document.getElementById('chartContainer');
  container.innerHTML = '<div class="loading">در حال بارگذاری...</div>';

  try {
    const resp = await fetch(`https://cjkxfclghjgmpzcxakpy.supabase.co/rest/v1/candles?symbol=eq.${encodeURIComponent(symbol+'/USDT')}}&timeframe=eq.5m&order=ts.asc&limit=1000`, {headers:{'apikey':'sb_publishable_l0iz-k9CIEYXpry0B_suhA_qj0VuWu_'}});
    const candles = await resp.json();
    if (!candles.length) { container.innerHTML = '<div class="loading">کندل یافت نشد</div>'; return; }

    const chartData = candles.map(c=>({ time: Math.floor(c.ts/1000), open:c.open, high:c.high, low:c.low, close:c.close }));

    if (!chart) {
      chart = LightweightCharts.createChart(container, {
        width: container.clientWidth, height: 450,
        layout: {background:{color:'#1e2329'}, textColor:'#848e9c'},
        grid: {vertLines:{color:'#2b3139'}, horzLines:{color:'#2b3139'}},
        rightPriceScale: {borderColor:'#2b3139'},
        timeScale: {borderColor:'#2b3139', timeVisible:true, secondsVisible:false}
      });
      candleSeries = chart.addCandlestickSeries({ upColor:'#0ecb81', downColor:'#f6465d', borderUpColor:'#0ecb81', borderDownColor:'#f6465d', wickUpColor:'#0ecb81', wickDownColor:'#f6465d' });
    }

    candleSeries.setData(chartData);
    chart.timeScale().fitContent();
    container.querySelector('.loading')?.remove();
  } catch(e) {
    container.innerHTML = `<div class="loading">خطا: ${e.message}</div>`;
  }
}
