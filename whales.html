<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Whale Portfolio Monitor — نهنگ‌های پامپ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#0b0f14;--card:#111820;--fg:#e8edf2;--muted:#7a8a9a;--acc:#00d4aa;--acc2:#ff6b4a;--line:#1e2a3a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;min-height:100vh}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
.container{max-width:1200px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
h1{font-size:1.5rem;font-weight:700}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.stat{background:var(--card);padding:8px 12px;border-radius:8px;border:1px solid var(--line)}
.stat b{color:var(--fg)}
.controls{display:flex;gap:8px;flex-wrap:wrap}
button{background:var(--acc);color:#001a14;border:none;padding:8px 14px;border-radius:6px;font-weight:600;cursor:pointer;font-size:.85rem}
button:hover{filter:brightness(1.1)}
button.sec{background:var(--card);color:var(--fg);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line)}
th{background:var(--card);color:var(--muted);font-weight:600;position:sticky;top:0;z-index:1}
tr:hover{background:#121a26}
.addr{font-family:monospace;font-size:.75rem;color:var(--acc)}
.addr.full{display:none}
.token{font-weight:600;color:var(--fg)}
.token.small{font-size:.7rem;color:var(--muted)}
.badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:.65rem;font-weight:700}
.badge.buy{background:#00d4aa22;color:var(--acc)}
.badge.sell{background:#ff6b4a22;color:var(--acc2)}
.badge.pumps{background:#6366f122;color:#a5b4fc}
.empty{text-align:center;padding:40px;color:var(--muted)}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);padding:2px 6px;border-radius:4px;font-size:.65rem;color:var(--muted)}
@media (max-width:700px){
  th:nth-child(3),td:nth-child(3),th:nth-child(4),td:nth-child(4){display:none}
  .addr{font-size:.65rem}
}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🐋 Whale Portfolio Monitor</h1>
<div class="stats">
<span class="stat">نهنگ‌ها: <b id="cTotal">—</b></span>
<span class="stat">آپدیت: <b id="cUpdated">—</b></span>
<span class="stat">موفق: <b id="cOk">—</b></span>
</div>
</header>
<div class="controls">
<button onclick="loadData()">🔄.refresh</button>
<button class="sec" onclick="toggleAuto()">⏱ اتو ۵د</button>
<button class="sec" onclick="toggleCols()">ستون‌ها</button>
<input type="text" id="search" placeholder="جستجوی آدرس/توکن…" style="padding:8px 12px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;min-width:200px">
</div>
<table id="tbl"><thead>
<tr><th>آدرس</th><th>پامپ‌ها</th><th>موجودی‌ها</th><th>خرید ۲۴h</th><th>فروش ۲۴h</th><th>نمادهای پامپ</th></tr>
</thead><tbody></tbody></table>
<div id="empty" class="empty" style="display:none">داده‌ای یافت نشد</div>
</div>
<script>
let autoTimer=null, showAllCols=true;
async function loadData(){
  try{
    const r=await fetch('whales_portfolio.json?v='+Date.now());
    if(!r.ok) throw new Error(r.status);
    const d=await r.json();
    render(d);
    document.getElementById('cTotal').textContent=d.total;
    document.getElementById('cOk').textContent=Object.values(d.whales).filter(w=>!w.error).length;
    document.getElementById('cUpdated').textContent=new Date(d.updated*1000).toLocaleString('fa-IR');
  }catch(e){
    console.error(e);
  }
}
function render(d){
  const tb=document.querySelector('#tbl tbody');
  tb.innerHTML='';
  const q=document.getElementById('search').value.toLowerCase();
  let count=0;
  for(const [addr,w] of Object.entries(d.whales)){
    if(w.error) continue;
    const syms=(w.whale_info?.symbols||[]).slice(0,12);
    const hay=addr.toLowerCase()+' '+syms.join(' ')+' '+(w.holdings||[]).map(h=>h.symbol).join(' ');
    if(q && !hay.includes(q)) continue;
    count++;
    const tr=document.createElement('tr');
    const holds=(w.holdings||[]).slice(0,8).map(h=>`<span class="pill">${h.symbol} ${h.amount.toFixed(2)}</span>`).join('');
    const buys=(w.buys_24h||[]).slice(0,5).map(b=>`<span class="badge buy">${b.symbol} ${b.amount.toFixed(2)}</span>`).join('') || '<span class="muted">—</span>';
    const sells=(w.sells_24h||[]).slice(0,5).map(s=>`<span class="badge sell">${s.symbol} ${s.amount.toFixed(2)}</span>`).join('') || '<span class="muted">—</span>';
    tr.innerHTML=`
      <td><span class="addr">${addr.slice(0,10)}…</span><span class="addr full">${addr}</span></td>
      <td><span class="badge pumps">${w.whale_info?.pumps||0}</span></td>
      <td>${holds||'<span class="muted">—</span>'}</td>
      <td>${buys}</td>
      <td>${sells}</td>
      <td><div class="pills">${syms.map(s=>`<span class="pill">${s}</span>`).join('')}</div></td>
    `;
    tb.appendChild(tr);
  }
  document.getElementById('empty').style.display=count? 'none':'block';
}
function toggleAuto(){
  const btn=document.querySelector('button.sec');
  if(autoTimer){
    clearInterval(autoTimer); autoTimer=null; btn.textContent='⏱ اتو ۵د';
  }else{
    autoTimer=setInterval(loadData,300000); btn.textContent='⏹ توقف'; loadData();
  }
}
function toggleCols(){
  showAllCols=!showAllCols;
  document.querySelectorAll('th:nth-child(3),td:nth-child(3),th:nth-child(4),td:nth-child(4),th:nth-child(5),td:nth-child(5)')
    .forEach(el=>el.style.display=showAllCols?'':'none');
}
document.getElementById('search').addEventListener('input',()=>loadData());
loadData();
</script>
</body>
</html>
